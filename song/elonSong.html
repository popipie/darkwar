<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>트로트 감성 가사 플레이어</title>
<!-- 트로트 감성에 어울리는 굵고 둥근 웹 폰트(Jua) 불러오기 -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  body {
    /* 어두운 무대 조명 느낌의 보랏빛 그라데이션 배경 */
    background: radial-gradient(circle, #3a0033 0%, #0a0011 100%);
    color: #ffffff;
    font-family: 'Jua', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  
  #audio-player {
    margin-bottom: 20px;
    width: 300px;
    /* 플레이어에도 약간의 핑크 그림자 부여 */
    box-shadow: 0 4px 15px rgba(255, 0, 127, 0.5);
    border-radius: 30px;
  }

  #lyrics-container {
    text-align: center;
    height: 350px;
    width: 95%;
    max-width: 600px;
    overflow-y: auto; 
    scroll-behavior: smooth; 
    -ms-overflow-style: none; 
    scrollbar-width: none; 
  }
  
  #lyrics-container::-webkit-scrollbar {
    display: none; 
  }

  #lyrics-scroll {
    padding: 150px 0; 
  }

  .lyric-line {
    padding: 15px 0;
    color: #888888; 
    font-size: 1.5rem;
    transition: all 0.3s ease-in-out;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
  }

  /* 활성화된 가사: 트로트/노래방 스타일의 하이라이트 */
  .lyric-line.active {
    color: #FFFF00; /* 쨍한 노란색 */
    font-size: 2.2rem; /* 글씨를 훨씬 크게 */
    /* 핫핑크색 두꺼운 테두리 */
    -webkit-text-stroke: 1.5px #FF007F; 
    /* 깊이감 있는 3D 그림자와 네온 발광 효과 */
    text-shadow: 3px 3px 0 #550022, 0 0 20px #FF007F, 0 0 40px #FF007F;
    transform: scale(1.1);
  }
</style>
</head>
<body>

  <audio id="audio-player" controls autoplay src="https://github.com/popipie/darkwar/raw/refs/heads/main/song/ElonSong.mp3"></audio>

  <div id="lyrics-container">
    <div id="lyrics-scroll"></div>
  </div>

  <script>
    const lyricsData = [
      { start: 14.0, end: 17.0, text: "일론 연합은 멍청이들" },
      { start: 17.0, end: 20.0, text: "배신자 집단" },
      { start: 20.0, end: 23.0, text: "돈만 쓰고 게임 못하는" },
      { start: 23.0, end: 26.0, text: "할매와 따까리들" },
      { start: 27.0, end: 30.0, text: "입만터는 바보들 천지" },
      { start: 30.0, end: 33.0, text: "허세만 가득" },
      { start: 34.0, end: 37.0, text: "굽실굽실 비아냥대는" },
      { start: 37.0, end: 40.0, text: "사람들 득실득실" },
      { start: 40.0, end: 43.5, text: "그러니 내분이 일어나고" },
      { start: 43.5, end: 47.0, text: "매번 또 사람이 떠나가지" },
      { start: 47.0, end: 51.0, text: "빈 자리에 누가올까" },
      { start: 51.0, end: 55.0, text: "또 같은 이야기가 시작되지" },
      { start: 56.0, end: 57.5, text: "불쌍하다 불쌍하다" },
      { start: 57.5, end: 59.0, text: "많이 불쌍하다" },
      { start: 59.0, end: 62.0, text: "또 이민받아 배신자로 채우겠네" },
      { start: 63.0, end: 64.5, text: "불쌍하다 불쌍하다" },
      { start: 64.5, end: 66.0, text: "정말 불쌍하다" },
      { start: 66.0, end: 72.0, text: "돈 썼는데 게임은 왜 못하나" }
    ];

    const scrollContainer = document.getElementById('lyrics-scroll');
    const audio = document.getElementById('audio-player');
    
    audio.volume = 0.5;
    
    const lyricElements = [];

    lyricsData.forEach(line => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.textContent = line.text;
      scrollContainer.appendChild(div);
      lyricElements.push(div);
    });

    let currentActiveIndex = -1;

    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      let newActiveIndex = -1;

      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].start && currentTime < lyricsData[i].end) {
          newActiveIndex = i;
          break;
        }
      }

      if (newActiveIndex !== currentActiveIndex) {
        
        if (currentActiveIndex !== -1 && lyricElements[currentActiveIndex]) {
          lyricElements[currentActiveIndex].classList.remove('active');
        }

        currentActiveIndex = newActiveIndex;

        if (currentActiveIndex !== -1 && lyricElements[currentActiveIndex]) {
          const activeEl = lyricElements[currentActiveIndex];
          activeEl.classList.add('active');
          activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (currentTime < lyricsData[0].start && lyricElements[0]) {
          lyricElements[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });
  </script>

</body>
</html>
